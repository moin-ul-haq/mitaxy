{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ subject }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f1f5f9; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9; padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:16px; overflow:hidden; border:1px solid #e2e8f0;">
          <!-- Header -->
          <tr>
            <td style="background-color:#0f766e; padding:22px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="vertical-align:middle; padding-right:10px;">
                    <div style="width:30px; height:30px; background:#0d5c55; border-radius:8px; text-align:center; line-height:30px; color:#5eead4; font-weight:800; font-size:16px;">M</div>
                  </td>
                  <td style="vertical-align:middle; color:#ffffff; font-size:19px; font-weight:800; letter-spacing:-.02em;">{{ brand_name }}</td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:34px 32px 12px;">
              {% block email_content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px 30px;">
              <hr style="border:none; border-top:1px solid #e2e8f0; margin:0 0 16px;">
              <p style="margin:0; font-size:12px; color:#94a3b8; line-height:1.6;">
                {{ brand_name }} — {{ brand_tagline }}<br>
                You're receiving this because you have a {{ brand_name }} account.
              </p>
            </td>
          </tr>
        </table>
        <p style="max-width:560px; margin:18px auto 0; font-size:11px; color:#cbd5e1;">© {{ brand_name }}</p>
      </td>
    </tr>
  </table>
</body>
</html>

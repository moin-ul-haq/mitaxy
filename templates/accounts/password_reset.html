{% extends "base.html" %}
{% block title %}Reset password{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth__card card card--pad">
    <div class="auth__head">
      <h1>Reset your password</h1>
      <p class="muted">Enter your email and we'll send you a reset link.</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/field.html" with field=form.email %}
      <button type="submit" class="btn btn--primary btn--block btn--lg">Send reset link</button>
    </form>
    <p class="auth__alt"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}

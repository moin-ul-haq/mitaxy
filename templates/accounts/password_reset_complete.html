{% extends "base.html" %}
{% block title %}Password updated{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth__card card card--pad center">
    <div class="empty__art">{% include "partials/icon.html" with name="check" %}</div>
    <h1>Password updated</h1>
    <p class="muted">Your password has been changed. You can now sign in with your new password.</p>
    <a href="{% url 'accounts:login' %}" class="btn btn--primary btn--lg">Sign in</a>
  </div>
</div>
{% endblock %}

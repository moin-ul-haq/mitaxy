{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} · Mitaxy Admin{% endblock %}

{% block branding %}
<div id="site-name" style="display:flex;align-items:center;gap:10px;">
  <a href="{% url 'admin:index' %}" style="display:flex;align-items:center;gap:10px;">
    <span style="display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;
                 background:#0d9488;color:#fff;font-weight:800;font-size:15px;">M</span>
    <span style="font-weight:700;letter-spacing:-.01em;">Mitaxy Administration</span>
  </a>

{% endblock %}

{% block extrastyle %}
{{ block.super }}

{% endblock %}

{% block userlinks %}

{% endblock %}
